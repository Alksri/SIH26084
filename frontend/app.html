<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Live map — BUMBLEBLE</title>
<meta name="description" content="Live thunderstorm map for East & North-East India: storm danger, lightning, hail, winds and cloudbursts for the next 6 hours.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="static/pages.css">
<link rel="stylesheet" href="static/map.css">
</head>
<body class="map-page">
<div id="map" aria-label="Storm map"></div>

<!-- top: search (left) + one-line situation summary (right) -->
<div class="m-search glass" role="search">
  <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="search" type="search" autocomplete="off" placeholder="Search a city, airport or district" aria-label="Search a place">
  <button type="button" class="m-loc" id="btn-locate" title="Use my location" aria-label="Use my location">
    <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg></button>
  <div id="search-results" class="m-results hidden" role="listbox"></div>
</div>
<a id="summary" class="m-summary glass" href="arrivals.html" title="See arrival times for every place">
  <span class="m-sum-dot"></span><span id="summary-text">Loading the latest forecast…</span><span class="m-sum-go" aria-hidden="true">→</span>
</a>

<div id="banner" class="m-banner hidden" role="alert"></div>

<!-- layer picker -->
<div class="m-layer">
  <button id="layer-btn" class="m-layer-btn glass" aria-expanded="false" aria-controls="layer-sheet">
    <span id="layer-ico" class="m-layer-ico">⚠️</span>
    <span class="m-layer-txt"><small>Showing</small><b id="layer-name">Overall storm danger</b></span>
    <svg class="i m-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div id="layer-sheet" class="m-sheet glass hidden">
    <div class="m-sheet-head"><b>Choose what to see</b><button type="button" class="m-x" id="sheet-close" aria-label="Close">✕</button></div>
    <div id="products"></div>
    <div class="m-sheet-sec">On the map</div>
    <div class="m-toggles">
      <label class="m-switch"><input type="checkbox" id="ov-cells" checked><span></span>Storms &amp; their paths</label>
      <label class="m-switch"><input type="checkbox" id="ov-strikes" checked><span></span>Live lightning strikes</label>
      <label class="m-switch"><input type="checkbox" id="ov-ci" checked><span></span>New storms forming</label>
      <label class="m-switch"><input type="checkbox" id="ov-clocks" checked><span></span>Countdowns for places</label>
      <label class="m-switch"><input type="checkbox" id="ov-radars"><span></span>Radar coverage</label>
    </div>
    <div class="m-sheet-sec">Layer strength</div>
    <input type="range" id="opacity" min="0.2" max="1" step="0.05" value="0.8" aria-label="Layer opacity">
    <div class="m-sheet-foot">
      <button type="button" class="btn sm" id="btn-share">🔗 Copy link to this view</button>
      <a class="btn sm" href="hazards.html">❓ What do layers mean?</a>
    </div>
  </div>
</div>

<!-- map type + live animations -->
<canvas id="wind-canvas" class="m-wind hidden" aria-hidden="true"></canvas>
<div class="m-mt">
  <button id="mt-btn" class="m-mt-btn" aria-expanded="false" aria-controls="mt-menu" title="Map type &amp; animations">
    <img id="mt-thumb" alt=""><span>Map type</span></button>
  <div id="mt-menu" class="m-mt-menu glass hidden">
    <div class="m-sheet-head"><b>Map type</b><button type="button" class="m-x" id="mt-close" aria-label="Close">✕</button></div>
    <div class="mt-grid" id="basemaps"></div>
    <div class="m-sheet-sec">Live animations</div>
    <div class="m-toggles">
      <label class="m-switch"><input type="checkbox" id="fx-wind"><span></span><i class="fx-ico">🌬️</i>Wind flow <em class="fx-tag">live</em></label>
      <label class="m-switch"><input type="checkbox" id="fx-rain"><span></span><i class="fx-ico">🌧️</i>Rain radar loop · last 2 h <em class="fx-tag">live</em></label>
      <label class="m-switch"><input type="checkbox" id="fx-flash" checked><span></span><i class="fx-ico">⚡</i>Lightning flashes</label>
    </div>
    <p class="fx-note" id="fx-note"></p>
  </div>
</div>
<div id="rain-badge" class="m-rain glass hidden">🌧️ Rain radar <b id="rain-time" class="mono">--:--</b></div>

<div id="legend" class="m-legend glass"></div>

<!-- timeline -->
<div class="m-timeline glass" id="timeline">
  <div class="tw-head">
    <div class="tw-ctrls">
      <button type="button" class="tw-step" id="step-back" title="10 minutes earlier (←)" aria-label="10 minutes earlier">
        <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <button id="play" class="m-play" title="Play the next 6 hours (Space)" aria-label="Play forecast">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>
      </button>
      <button type="button" class="tw-step" id="step-fwd" title="10 minutes later (→)" aria-label="10 minutes later">
        <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
    <div class="tw-when">
      <small id="tw-kicker">Forecast time</small>
      <b id="lead-text">Now</b>
    </div>
    <div class="tw-clock"><span class="tw-clock-ico" aria-hidden="true">🕒</span><span id="valid-time" class="mono">--:--</span></div>
    <button type="button" class="tw-now" id="go-now" title="Back to the current time">Now</button>
  </div>
  <div class="tw-track" id="tw-track">
    <div class="tw-strip" id="tw-strip" aria-hidden="true"></div>
    <div class="tw-fill" id="tw-fill" aria-hidden="true"></div>
    <input id="lead" type="range" min="0" max="36" value="0" step="1" aria-label="Forecast time">
  </div>
  <div class="tw-ticks" id="tw-ticks">
    <button type="button" data-min="0">Now</button><button type="button" data-min="60">1h</button><button type="button" data-min="120">2h</button>
    <button type="button" data-min="180">3h</button><button type="button" data-min="240">4h</button><button type="button" data-min="300">5h</button>
    <button type="button" data-min="360">6h</button>
  </div>
</div>

<div id="demo-note" class="m-demo glass hidden">🧪 <span>Demo mode — these storms are simulated, not real weather.</span><button type="button" aria-label="Dismiss">✕</button></div>
<div id="hint" class="m-hint glass hidden">👆 <span>Tip: <b>click anywhere</b> on the map to see what to expect there.</span><button type="button" aria-label="Dismiss">✕</button></div>
<div class="m-toasts" id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="static/config.js"></script>
<script src="static/pages.js"></script>
<script src="static/map.js"></script>
</body>
</html>

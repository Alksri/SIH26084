[build]
  publish = "frontend"
  functions = "netlify/functions"

# ── AI assistant route ────────────────────────────────────────────
[[redirects]]
  from = "/api/assistant"
  to = "/.netlify/functions/assistant"
  status = 200

# ── info endpoint (provider status pill) ─────────────────────────
[[redirects]]
  from = "/api/assistant/info"
  to = "/.netlify/functions/assistant-info"
  status = 200

# ── page routes ───────────────────────────────────────────────────
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/arrivals"
  to = "/arrivals.html"
  status = 200

[[redirects]]
  from = "/alerts"
  to = "/alerts.html"
  status = 200

[[redirects]]
  from = "/hazards"
  to = "/hazards.html"
  status = 200

[[redirects]]
  from = "/assistant"
  to = "/assistant.html"
  status = 200

[[redirects]]
  from = "/system"
  to = "/system.html"
  status = 200
